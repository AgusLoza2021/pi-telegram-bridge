name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the running job obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The published supported environment is Windows 11 with Windows PowerShell 5.1
    # and Node.js 24 or newer. A Linux or macOS job would claim support the project
    # does not have, and SECURITY.md would contradict it.
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 15

    # Windows PowerShell 5.1 must be able to autoload Microsoft.PowerShell.Security.
    # The hosted runner exports a PSModulePath that points at a PowerShell 7
    # install, so 5.1 discovers a security module it cannot load, and every
    # Get-Acl call fails with "found in the module ... but the module could not be
    # loaded". That breaks Test-BridgeStateRootAcl in scripts/common.ps1 and
    # verifyUserOnlyAclWindows in src/state-acl.mjs, which then report
    # acl_inheritance_enabled: an unmeasurable probe presented as a security
    # finding.
    #
    # Job-level env, not GITHUB_ENV: this value must be in the environment of
    # every step's whole process tree, including the powershell.exe children the
    # integration tests spawn. Windows PowerShell 5.1 still appends its own
    # default module directories, so this only removes the PowerShell 7 path that
    # breaks the autoload; it does not hide any module the project relies on.
    env:
      PSModulePath: 'C:\Program Files\WindowsPowerShell\Modules;C:\Windows\system32\WindowsPowerShell\v1.0\Modules'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The floor here matches package.json "engines" and the README prerequisites
      # table. A floating specifier such as lts/* would hide a toolchain change.
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # Replaces the earlier GITHUB_ENV attempt, which the test steps did not
      # inherit. This proves the value above reaches a grandchild process shaped
      # exactly like the ones the tests spawn, so a module-path mistake fails here
      # as one line instead of surfacing as seventeen confusing test failures.
      - name: Prove Windows PowerShell 5.1 can load its security module
        shell: powershell
        run: |
          Write-Host "step PSModulePath=$env:PSModulePath"
          & powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Write-Output "child PSModulePath=$env:PSModulePath"; Get-Acl -LiteralPath $env:TEMP | Out-Null; Write-Output "child Get-Acl resolved"'

      # The exact command CONTRIBUTING.md documents: the single pinned production
      # dependency, no package lifecycle scripts, no audit, no fund.
      - name: Install the pinned dependency
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run the node test suite
        run: npm test

      # scripts/test.ps1 is the documented single validation entry point. It re-runs
      # the node suite through the shared runner and then parses every scripts/*.ps1
      # file with the real Windows PowerShell 5.1 parser. The duplicated node run is
      # deliberate: it is what proves the gate contributors are told to run actually
      # passes, and the job finishes in well under a minute.
      - name: Run the documented gate (scripts/test.ps1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1
