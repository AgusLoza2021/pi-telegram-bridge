name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the running job obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The published supported environment is Windows 11 with Windows PowerShell 5.1
    # and Node.js 24 or newer. A Linux or macOS job would claim support the project
    # does not have, and SECURITY.md would contradict it.
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 15

    # Windows PowerShell 5.1 must be able to AUTOLOAD Microsoft.PowerShell.Security.
    # The hosted runner exports a PSModulePath whose first entry,
    # %ProgramFiles%\WindowsPowerShell\Modules, carries a copy of that module built
    # for PowerShell 7. Windows PowerShell 5.1 discovers that copy first, cannot
    # load it, and reports
    #
    #   The 'Get-Acl' command was found in the module 'Microsoft.PowerShell.Security',
    #   but the module could not be loaded.
    #
    # An explicit Import-Module by name still resolves the working copy, which is
    # why an earlier version of this step looked healthy while every test that
    # relied on autoload failed.
    #
    # Every module this project uses (Security for Get-Acl/Set-Acl and the DPAPI
    # cmdlets, ScheduledTasks, CimCmdlets, LocalAccounts) ships in the single
    # directory below, so restricting the path to it removes only the shadowing
    # PowerShell 7 copy. Job-level env and not GITHUB_ENV: the value has to be in
    # the environment of every step's whole process tree, including the
    # powershell.exe children the integration tests spawn.
    env:
      PSModulePath: 'C:\Windows\system32\WindowsPowerShell\v1.0\Modules'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The floor here matches package.json "engines" and the README prerequisites
      # table. A floating specifier such as lts/* would hide a toolchain change.
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # The previous probe settled that a PowerShell-spawned child with the exact
      # test flags works: same PSModulePath, FullLanguage, Unrestricted, module
      # 3.0.0.0 discovered, Get-Acl OK. One difference from the failing tests
      # remained unexplored: they spawn from Node with windowsHide, which creates
      # the child without a console. This runs the identical probe both ways and
      # also tries an explicit Import-Module, which is the candidate fix.
      - name: Diagnose the PowerShell the node children actually get
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ps-child-probe.mjs" <<'EOF'
          import { spawnSync } from 'node:child_process';
          const probe = [
            'Write-Output "    PSModulePath: $env:PSModulePath"',
            'Write-Output "    LanguageMode: $($ExecutionContext.SessionState.LanguageMode)"',
            'Get-Module -ListAvailable Microsoft.PowerShell.Security | ForEach-Object { Write-Output "    discovered: $($_.Version) $($_.ModuleBase)" }',
            'try { Get-Acl -LiteralPath $env:TEMP | Out-Null; Write-Output "    Get-Acl: OK" } catch { Write-Output "    Get-Acl: FAILED $($_.Exception.Message)" }',
            'try { Import-Module Microsoft.PowerShell.Security -ErrorAction Stop; Write-Output "    Import-Module: OK" } catch { Write-Output "    Import-Module: FAILED $($_.Exception.Message)" }',
          ].join('; ');
          for (const windowsHide of [false, true]) {
            const r = spawnSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-Command', probe], { encoding: 'utf8', windowsHide });
            console.log(`NODE CHILD windowsHide=${windowsHide} status=${r.status}`);
            console.log(r.stdout);
            console.log(r.stderr);
          }
          EOF
          node "$RUNNER_TEMP/ps-child-probe.mjs"

      # The exact command CONTRIBUTING.md documents: the single pinned production
      # dependency, no package lifecycle scripts, no audit, no fund.
      - name: Install the pinned dependency
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run the node test suite
        run: npm test

      # scripts/test.ps1 is the documented single validation entry point. It re-runs
      # the node suite through the shared runner and then parses every scripts/*.ps1
      # file with the real Windows PowerShell 5.1 parser. The duplicated node run is
      # deliberate: it is what proves the gate contributors are told to run actually
      # passes, and the job finishes in well under a minute.
      - name: Run the documented gate (scripts/test.ps1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1
