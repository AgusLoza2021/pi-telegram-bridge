name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the running job obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The published supported environment is Windows 11 with Windows PowerShell 5.1
    # and Node.js 24 or newer. A Linux or macOS job would claim support the project
    # does not have, and SECURITY.md would contradict it.
    # Windows PowerShell 5.1 must be able to AUTOLOAD Microsoft.PowerShell.Security,
    # because the integration tests drive real ACLs and DPAPI through
    # Get-Acl/Set-Acl in powershell.exe children.
    #
    # The default shell for a run: step on this image is pwsh (PowerShell 7), and
    # its PSModulePath carries the PowerShell 7 module directories. The
    # powershell.exe children the tests spawn inherit that path, find the
    # PowerShell 7 copy of Microsoft.PowerShell.Security first, cannot load it and
    # report
    #
    #   The 'Get-Acl' command was found in the module 'Microsoft.PowerShell.Security',
    #   but the module could not be loaded.
    #
    # src/state-acl.mjs turns that into acl_inheritance_enabled, so it looked like
    # seventeen ACL and DPAPI test failures rather than a shell choice.
    #
    # Overriding PSModulePath does not work: both PowerShell versions rebuild it
    # from the machine and user values, so neither a job-level env: nor GITHUB_ENV
    # reaches the children. The fix is to run the suite in the shell the project
    # supports, which is why the steps below declare shell: powershell.
    #
    # What this workflow cannot verify: the ACL, DPAPI, scheduled-task and
    # setup.ps1 integration tests need a session whose user is NOT an
    # administrator, because the state root must be lockable to the invoking user
    # alone. A hosted runner session is an administrator session, so those tests
    # print the environment reason and skip themselves rather than weaken the
    # invariant they exist to protect. Everything else runs here, and the
    # complete gate is scripts/test.ps1 on a real machine. CONTRIBUTING.md
    # describes the split.
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The floor here matches package.json "engines" and the README prerequisites
      # table. A floating specifier such as lts/* would hide a toolchain change.
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # Evidence for the shell choice below. The default shell for a run: step is
      # pwsh, whose module path carries the PowerShell 7 directories that the
      # tests' powershell.exe children then inherit.
      - name: Report the module path the default shell exports
        shell: pwsh
        run: Write-Host "pwsh PSModulePath=$env:PSModulePath"

      # Guards the choice: if the image ever stops shipping a Windows PowerShell
      # 5.1 that can autoload Get-Acl, this fails as one line instead of surfacing
      # as seventeen ACL and DPAPI test failures.
      - name: Prove Windows PowerShell 5.1 autoloads Get-Acl
        shell: powershell
        run: |
          Write-Host "5.1 PSModulePath=$env:PSModulePath"
          try { Get-Acl -LiteralPath $env:TEMP | Out-Null; Write-Host 'Get-Acl autoloaded' }
          catch { Write-Host "Get-Acl autoload FAILED: $($_.Exception.Message)"; exit 1 }

      # The exact command CONTRIBUTING.md documents: the single pinned production
      # dependency, no package lifecycle scripts, no audit, no fund.
      - name: Install the pinned dependency
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      # shell: powershell is load-bearing, not cosmetic: it is what puts the
      # Windows PowerShell 5.1 module path into the environment of the
      # powershell.exe children the integration tests spawn. See the job comment.
      - name: Run the node test suite
        shell: powershell
        run: npm test

      # scripts/test.ps1 is the documented single validation entry point. It re-runs
      # the node suite through the shared runner and then parses every scripts/*.ps1
      # file with the real Windows PowerShell 5.1 parser. The duplicated node run is
      # deliberate: it is what proves the gate contributors are told to run actually
      # passes, and the job finishes in well under a minute.
      - name: Run the documented gate (scripts/test.ps1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1
